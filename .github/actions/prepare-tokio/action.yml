name: Prepare Tokio tests
description: Prepare the upstream workspace with the Guest attachment adapter.

outputs:
  workspace:
    description: Upstream workspace directory.
    value: ${{ steps.prepare.outputs.workspace }}

runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        source=$(cargo run --manifest-path tests/Cargo.toml -p upstream-tests)
        cp -R "$source" "$RUNNER_TEMP/tokio"
        mkdir -p "$RUNNER_TEMP/tokio/.config"
        cp .config/nextest.toml "$RUNNER_TEMP/tokio/.config/nextest.toml"
        echo "workspace=$RUNNER_TEMP/tokio" >> "$GITHUB_OUTPUT"
