name: Windows preparation
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  prepare:
    name: Windows (${{ matrix.toolchain }})
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly-2026-07-01]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Mixed workspace
        run: cargo run -vv -p telekio -- cargo check -vv --workspace --locked
      - name: Upstream workspace
        run: cargo run -vv --manifest-path tests/Cargo.toml -p upstream-tests
