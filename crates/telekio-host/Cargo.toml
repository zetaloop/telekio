[package]
name = "telekio-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Host runtime backend for Telekio"

[features]
schedule-latency = ["tokio/schedule-latency"]
taskdump = ["tokio/taskdump"]

[dependencies]
telekio = { version = "=0.1.0", path = "../telekio" }
tokio = { version = "=0.1.0", path = "../telekio-tokio", package = "telekio-tokio", features = ["net", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

[target."cfg(unix)".dependencies]
libc = "0.2.168"
tokio = { version = "=0.1.0", path = "../telekio-tokio", package = "telekio-tokio", features = ["process"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
