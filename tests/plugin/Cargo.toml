[package]
name = "plugin"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
telekio = { version = "0.1.0", path = "../../crates/telekio" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
